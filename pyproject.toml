[project]
name = "value-leakage-forensics"
version = "0.1.0"
description = "Model-forensics experiments on Donation-Bet motivated reasoning (E1 modes, E2 dynamics, scouting runs)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.40",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Needed only for scripts/01_generate.py --sampler tinker
tinker = ["tinker", "tinker-cookbook"]
# The HF read-out scripts (08b/08c) load the model with device_map="auto", which transformers
# refuses to do without accelerate. torch/transformers themselves are installed per-host by
# runpod_setup.sh against that pod's CUDA, so they are deliberately not pinned here.
readout = ["accelerate>=0.30"]
# 13_deception_probe.py: LogisticRegression + StandardScaler, matching Apollo's detectors.py
probe = ["accelerate>=0.30", "scikit-learn>=1.3", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensics*"]
